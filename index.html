<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechBurstHub Portfolio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Header / Navbar -->
  <header class="header">
    <nav class="nav">
      <div class="logo">TechBurstHub</div>
      <button class="menu-btn" aria-label="Toggle menu">&#9776;</button>
      <ul class="nav-links">
        <li><a href="#hero">Home</a></li>
        <li><a href="#products">Products</a></li>
        <li><a href="#other-projects">Other Projects</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- Hero Section -->
  <section id="hero" class="hero">
    <h1>Welcome to TechBurstHub</h1>
    <p>Your go-to place for the latest tech gadgets!</p>
  </section>

  <!-- Filters -->
  <section class="filters">
    <input type="text" id="search" placeholder="Search products...">
    <select id="category">
      <option>All</option>
      <option>Audio</option>
      <option>Accessories</option>
      <option>Wearables</option>
      <option>Electronics</option>
    </select>
    <select id="sort">
      <option value="default">Default</option>
      <option value="price-asc">Price Low → High</option>
      <option value="price-desc">Price High → Low</option>
    </select>
  </section>

  <!-- Products Grid -->
  <main class="main">
    <div class="products" id="products"></div>
  </main>

<!--Other Projects-->
<section id="other-projects">
    <div class="products"></div>
</section>

<!--Contact Form-->
<section id="contact" class="contact">
    <h2>Contact Me</h2>
    <form action="https://formspree.io/f/mlgeygjj" method="POST">
        <label for="name">Your Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Your Email</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Your Message:</label>
        <textarea name="message" id="message" rows="5" required></textarea>
        <button type="submit">Send Message</button>
    </form>
</section>

  <!-- Footer -->
  <footer class="footer">
    &copy; 2025 TechBurstHub. All rights reserved.
  </footer>

  <script src="script.js"></script>
</body>
</html>
